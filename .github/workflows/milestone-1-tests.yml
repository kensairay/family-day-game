name: Milestone 1 isolated acceptance
on:
  push:
    branches: [feature/milestone-1-foundation]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps --only-shell chromium webkit
      - run: npm run test:admin:browser
      - run: node node_modules/wrangler/bin/wrangler.js deploy --dry-run --config wrangler.staging.json --outdir /tmp/staging-dry-run
  staging:
    needs: acceptance
    if: github.ref == 'refs/heads/feature/milestone-1-foundation' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: staging
    concurrency:
      group: family-day-game-staging
      cancel-in-progress: false
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Check Cloudflare connection
        id: connection
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STAGING_ADMIN_SECRET: ${{ secrets.STAGING_ADMIN_SECRET }}
        run: node scripts/staging/readiness.mjs
      - if: steps.connection.outputs.ready == 'true'
        run: npm ci
      - if: steps.connection.outputs.ready == 'true'
        run: npx playwright install --with-deps --only-shell chromium webkit
      - if: steps.connection.outputs.ready == 'true'
        run: npm run build
      - name: Deploy isolated Staging Worker and D1
        if: steps.connection.outputs.ready == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STAGING_ADMIN_SECRET: ${{ secrets.STAGING_ADMIN_SECRET }}
        run: node scripts/staging/deploy.mjs
      - name: Verify remote HTTPS game
        if: steps.connection.outputs.ready == 'true'
        env:
          STAGING_ADMIN_SECRET: ${{ secrets.STAGING_ADMIN_SECRET }}
        run: npm run staging:verify
      - name: Save remote acceptance report
        if: always() && steps.connection.outputs.ready == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: staging-acceptance
          path: staging-acceptance.generated.json
          if-no-files-found: ignore
          retention-days: 7
