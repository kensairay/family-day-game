<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#11263f"><title>家庭日｜全員出動</title><link rel="stylesheet" href="/styles.css"><script type="module" src="/app.js"></script></head>
<body data-role="player"><main class="shell"><header class="topbar"><span class="brand">✦ 全員出動！</span><span class="tag">家庭日</span></header><p id="connection" class="status" role="status">正在連線…</p><p id="notice" class="tiny" role="status"></p>
<section id="joinPanel" hidden><p class="eyebrow">一人一機 · 答題挑戰</p><h1>一起玩，<br>一起拿分。</h1><p>輸入暱稱加入，答對每題固定加分。重複暱稱會自動加上編號。</p><form id="joinForm" class="card"><label for="nickname">你的暱稱</label><input id="nickname" maxlength="10" autocomplete="nickname" placeholder="例如：小明"><button class="primary" id="joinBtn" type="submit">加入遊戲 →</button></form></section>
<section id="gamePanel" hidden><p class="eyebrow" id="identity"></p><div class="score"><span id="scoreLabel">個人分數</span><strong id="score">0 分</strong></div><div class="card"><h2 id="phaseHeading" tabindex="-1"></h2><p id="roundName" class="eyebrow"></p><div class="progress" aria-hidden="true"><div id="progress"></div></div><p class="question" id="question"></p><div class="answers" id="answers"></div><p class="feedback" id="feedback" role="status" aria-live="polite"></p><button class="secondary" id="retryBtn" hidden>重新送出答案</button></div><section id="rankPanel" hidden><h2>個人排行榜</h2><p class="tiny">同分並列；需要決定獲獎名次時，請依主持人指示上台決勝。</p><div class="card" id="leaderboard"></div></section></section>
</main></body></html>
