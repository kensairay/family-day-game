<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>家庭日｜主持人</title><link rel="stylesheet" href="/styles.css"><script src="/vendor/qrcode.js" defer></script><script type="module" src="/app.js"></script></head>
<body data-role="host"><main class="shell"><header class="topbar"><span class="brand">✦ 主持人控制台</span><span class="tag">家庭日</span></header><p id="connection" class="status" role="status">正在連線…</p><p id="notice" class="tiny" role="status"></p>
<form id="loginPanel" class="card"><h1>主持人登入</h1><label for="hostKey">主持人登入碼</label><input id="hostKey" type="password" autocomplete="current-password" required><button class="primary" id="loginBtn">登入</button></form>
<section id="gamePanel" hidden><div class="host-controls"><button class="primary" id="startBtn">開始遊戲 →</button><button class="primary" id="revealBtn" hidden>公布答案並計分</button><button class="primary" id="nextBtn" hidden>下一題 →</button><button class="secondary" id="pauseBtn" hidden>暫停收答案</button><button class="primary" id="resumeBtn" hidden>恢復本題作答</button><button class="primary" id="retryHostBtn" hidden>重試上次操作</button></div><p id="sessionLabel" class="eyebrow"></p>
<details id="bankPanel" class="card" open><summary>Excel 題庫匯入</summary><p id="bankSummary"></p><p class="tiny">遊戲開始前才能發布題庫。回合及題數依 Excel 設定，答對固定 260 分。</p><a id="templateLink" href="/question-bank-template.xlsx" download="家庭日題庫範本.xlsx">下載 Excel 題庫範本</a><label for="bankFile">選擇 .xlsx 題庫</label><input id="bankFile" type="file" accept=".xlsx"><p id="bankStatus" role="status"></p><div id="bankPreview"></div><button id="publishBankBtn" class="primary" disabled>預覽發布題庫</button></details>
<form id="sessionPanel" class="card"><h2>建立新場次</h2><p class="tiny">本場結束後可建立新場。沿用已發布題庫，玩家重新加入、分數歸零，舊紀錄保留；網址與登入碼不變。</p><label for="sessionTitle">新場次名稱</label><input id="sessionTitle" maxlength="40" required placeholder="例如：正式家庭日或第三次彩排"><button id="newSessionBtn" class="secondary">建立新場次</button><p id="sessionHelp" class="tiny"></p></form>
<details id="historyPanel" class="card"><summary>過去場次紀錄</summary><label for="historySession">選擇場次</label><select id="historySession"></select><p id="historyStatus" class="tiny"></p><button id="downloadHistoryBtn" class="secondary" disabled>下載此場紀錄</button></details><details class="card" id="inviteDetails" open><summary>邀請玩家加入（QR Code）</summary><img class="qr" id="qr" alt="玩家加入 QR Code"><a class="join-link" id="joinLink"></a><p><a href="/screen.html" target="_blank" rel="noopener">開啟投影畫面 ↗</a></p></details><div class="stats"><span id="playerCount"></span><span id="connectedCount"></span><span id="answeredCount"></span></div><p id="archiveStatus" class="tiny" role="status"></p><div class="card"><h2 id="phaseHeading" tabindex="-1"></h2><p id="roundName" class="eyebrow"></p><p class="question" id="question"></p><div class="answers" id="answers"></div><p class="feedback" id="feedback"></p></div><form id="skipPanel" class="card" hidden><h2>跳過本題</h2><p class="tiny">本題不計分，也不公布正解；下一題仍需手動開始。</p><label for="skipReason">跳題理由</label><input id="skipReason" maxlength="120" required placeholder="例如：題目有誤或時間調整"><button class="secondary" id="requestSkipBtn">預覽跳題</button></form>
<form id="adjustPanel" class="card" hidden><h2>補分／扣分</h2><p class="tiny" id="adjustHelp">請在登記決勝名次前修正分數。每次操作會保留理由與前後分數。</p><label for="adjustPlayer">玩家</label><select id="adjustPlayer"></select><label for="adjustDelta">增減分數（扣分請輸入負數）</label><input id="adjustDelta" type="number" min="-10000" max="10000" step="1" required placeholder="例如：260 或 -260"><label for="adjustReason">調整理由</label><input id="adjustReason" maxlength="120" required placeholder="例如：現場核對後補分"><button class="secondary" id="previewAdjustmentBtn">預覽分數調整</button></form>
<section id="confirmationPanel" class="card" hidden aria-labelledby="confirmationHeading"><h2 id="confirmationHeading">確認操作</h2><p id="confirmationText" role="status"></p><button id="confirmActionBtn" class="primary">確認執行</button><button id="cancelActionBtn" class="secondary">取消</button></section>
<section id="rankPanel" hidden><h2>個人排行榜</h2><div class="card" id="leaderboard"></div></section><form id="finalRankPanel" class="card" hidden><h2>登記上台決勝結果</h2><p class="tiny">只登記最終名次，保留原答題積分。</p><label for="finalPlayer">玩家</label><select id="finalPlayer"></select><label for="finalRank">最終名次</label><input id="finalRank" type="number" min="1" step="1" required><button id="saveRankBtn" class="primary">登記最終名次</button></form><button id="exportBtn" class="secondary">下載答題與操作紀錄</button><button id="logoutBtn" class="secondary">登出主持人</button></section>
</main></body></html>
