<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>家庭日｜主持人</title><link rel="stylesheet" href="/styles.css"><script src="/vendor/qrcode.js" defer></script><script type="module" src="/app.js"></script></head>
<body data-role="host"><main class="shell"><header class="topbar"><span class="brand">✦ 主持人控制台</span><span class="tag">家庭日</span></header><p id="connection" class="status" role="status">正在連線…</p><p id="notice" class="tiny" role="status"></p>
<form id="loginPanel" class="card"><h1>主持人登入</h1><label for="hostKey">主持人登入碼</label><input id="hostKey" type="password" autocomplete="current-password" required><button class="primary" id="loginBtn">登入</button></form>
<section id="gamePanel" hidden><div class="card"><h2>邀請玩家加入</h2><img class="qr" id="qr" alt="玩家加入 QR Code"><a class="join-link" id="joinLink"></a><p><a href="/screen.html" target="_blank" rel="noopener">開啟投影畫面 ↗</a></p></div><div class="stats"><span id="playerCount"></span><span id="connectedCount"></span><span id="answeredCount"></span></div><p id="archiveStatus" class="tiny" role="status"></p><div class="card"><h2 id="phaseHeading" tabindex="-1"></h2><p id="roundName" class="eyebrow"></p><p class="question" id="question"></p><div class="answers" id="answers"></div><p class="feedback" id="feedback"></p><button class="primary" id="startBtn">開始第一回合 →</button><button class="primary" id="revealBtn" hidden>公布答案並計分</button><button class="primary" id="nextBtn" hidden>下一題 →</button></div><section id="rankPanel" hidden><h2>個人排行榜</h2><div class="card" id="leaderboard"></div></section><form id="finalRankPanel" class="card" hidden><h2>登記上台決勝結果</h2><p class="tiny">只登記最終名次，保留原答題積分。</p><label for="finalPlayer">玩家</label><select id="finalPlayer"></select><label for="finalRank">最終名次</label><input id="finalRank" type="number" min="1" step="1" required><button id="saveRankBtn" class="primary">登記最終名次</button></form><button id="exportBtn" class="secondary">下載答題與操作紀錄</button><button id="logoutBtn" class="secondary">登出主持人</button></section>
</main></body></html>
